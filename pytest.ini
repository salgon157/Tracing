[pytest]
# Holé `pytest` z kořene = totéž co startup brána (jen tests/). webui testy
# se pouští explicitně: pytest webui/tests
testpaths = tests
# Archivní worktree starého solveru (_baseline_*, jen během regresního A/B)
# nesmí pytest sbírat — má vlastní tests/ se stejnými jmény modulů →
# ImportPathMismatchError. Zbytek = běžný úklid.
norecursedirs = _baseline_* .git __pycache__ data benchmark experiments scripts
